{% extends "base.html" %}
{% block content %}
<h2>Add New Task</h2>
<form method="post" action="{{ url_for('add_task') }}">
  <input name="title" placeholder="Task title" required>
  <textarea name="description" placeholder="Description (optional)"></textarea>
  <button type="submit" class="btn-green">+ Add Task</button>
</form>
<h2>My Tasks ({{ tasks|length }})</h2>
{% if tasks %}
<table>
  <tr><th>Title</th><th>Description</th><th>Status</th><th>Actions</th></tr>
  {% for t in tasks %}
  <tr>
    <td>{{ t.title }}</td>
    <td>{{ t.description }}</td>
    <td class="status-{{ t.status }}">{{ t.status }}</td>
    <td>
      <a class="btn" href="{{ url_for('edit_task', task_id=t.id) }}">Edit</a>
      <form method="post" action="{{ url_for('delete_task', task_id=t.id) }}" style="display:inline" onsubmit="return confirm('Delete this task?')">
        <button class="btn-red">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}<p>No tasks yet. Add one above!</p>{% endif %}
{% endblock %}
