{% extends "auth/_layout.html" %}
{% block title %}Log in{% endblock %}
{% block form %}
<h1>Welcome back</h1>
<p class="muted" style="margin:4px 0 22px">Log in to continue to your workspace.</p>
<form method="post" id="login-form">
  <div class="field"><label for="username">Username or email</label>
    <input type="text" id="username" name="username" required autofocus value="{{ request.form.username }}"></div>
  <div class="field"><label for="password">Password</label>
    <input type="password" id="password" name="password" required></div>
  <button type="submit" class="btn btn-primary btn-block">Log in</button>
</form>
<p class="muted" style="margin-top:18px">No account? <a href="{{ url_for('auth.signup') }}">Create one</a></p>
{% endblock %}
